<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja de Panes Simple</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f7f5f0; margin: 0; padding: 20px; color: #333; }
        h1 { color: #5a534f; }
        
        .btn-pan { 
            font-size: 110px; 
            padding: 15px 40px; 
            border-radius: 35px; 
            border: none; 
            background: #fceade; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
            cursor: pointer; 
            transition: transform 0.1s; 
            margin-top: 10px;
        }
        .btn-pan:active { transform: scale(0.93); }
        
        .iconos-container { 
            min-height: 80px; 
            margin: 20px 0; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 10px; 
            padding: 0 10px;
        }
        
        /* Cada pan de la lista ahora es un botón táctil real para asegurar el toque en tablets */
        .icono-item {
            background: #fff;
            border: 2px solid #e0dad0;
            border-radius: 12px;
            font-size: 40px;
            padding: 5px 10px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
            transition: transform 0.1s, background-color 0.1s;
        }
        .icono-item:active { 
            transform: scale(0.85); 
            background-color: #f8d7da; 
            border-color: #f5c6cb;
        }

        .total-texto { font-size: 55px; font-weight: bold; margin: 15px 0; color: #2c2825; }
        
        .btn-cobrar { 
            font-size: 35px; 
            padding: 15px 40px; 
            background-color: #d4edda; 
            color: #155724;
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            box-shadow: 0 5px 10px rgba(0,0,0,0.08);
            font-weight: bold;
        }
        .btn-cobrar:active { transform: scale(0.95); }

        .estadisticas { margin-top: 35px; font-size: 22px; color: #666; background: #fff; display: inline-block; padding: 10px 25px; border-radius: 15px; box-shadow: 0 3px 6px rgba(0,0,0,0.05); }
        
        .hint-borrar { font-size: 16px; color: #777; margin-top: 5px; font-style: italic; min-height: 24px; }

        /* Panel config */
        .btn-config { position: absolute; top: 20px; right: 20px; font-size: 30px; background: none; border: none; cursor: pointer; }
        .panel-config { display: none; background: #fff; padding: 25px; border-radius: 20px; margin: 30px auto; max-width: 400px; text-align: left; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 1px solid #e3ded8; }
        .panel-config label { font-size: 18px; display: block; margin-top: 10px; }
        .panel-config input { font-size: 20px; width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; }
        .panel-config button.btn-accion { font-size: 18px; padding: 10px; margin-top: 15px; cursor: pointer; background: #f8d7da; color: #721c24; border: none; border-radius: 10px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <button class="btn-config" onclick="toggleConfig()">⚙️</button>

    <h1>Venta de Pan</h1>
    
    <!-- Botón gigante para sumar -->
    <button class="btn-pan" onclick="agregarPan()">🍞</button>
    
    <!-- Contenedor de iconos interactivos -->
    <div class="iconos-container" id="iconos-pan"></div>
    <div class="hint-borrar" id="hint-borrar"></div>
    
    <div class="total-texto">Total: $<span id="total-precio">0</span></div>
    
    <button class="btn-cobrar" onclick="cobrar()">✅ Listo (Cobrar)</button>

    <div class="estadisticas">
        Panes vendidos hoy: <strong id="total-dia">0</strong>
    </div>

    <!-- Panel de configuración oculto -->
    <div class="panel-config" id="panel-config">
        <h3>Panel Adulto</h3>
        <label>Precio unitario por pan ($):</label>
        <input type="number" id="input-precio" value="1000" onchange="actualizarPrecio()">
        <button class="btn-accion" onclick="reiniciarDia()">Reiniciar contador diario</button>
    </div>

    <script>
        let precioUnitario = 1000;
        let panesActuales = 0;
        let panesDia = 0;

        function reproducirSonido(tipo) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                if (tipo === 'agregar') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
                }
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) { console.log("Audio bloqueado"); }
        }

        function agregarPan() {
            panesActuales++;
            reproducirSonido('agregar');
            actualizarPantalla();
        }

        function quitarPan() {
            if (panesActuales > 0) {
                panesActuales--;
                reproducirSonido('quitar');
                actualizarPantalla();
            }
        }

        function cobrar() {
            if(panesActuales > 0) {
                panesDia += panesActuales;
                panesActuales = 0;
                document.getElementById('total-dia').innerText = panesDia;
                actualizarPantalla();
            }
        }

        function actualizarPantalla() {
            document.getElementById('total-precio').innerText = panesActuales * precioUnitario;
            
            let contenedor = document.getElementById('iconos-pan');
            let hint = document.getElementById('hint-borrar');
            contenedor.innerHTML = "";
            
            if (panesActuales > 0) {
                hint.innerText = "💡 Si te pasaste, tocá cualquier pancito de abajo para sacarlo.";
                for(let i = 0; i < panesActuales; i++) {
                    // Usamos un botón real para garantizar respuesta táctil inmediata en pantallas táctiles
                    let btn = document.createElement('button');
                    btn.className = 'icono-item';
                    btn.innerText = "🍞";
                    btn.onclick = () => quitarPan();
                    contenedor.appendChild(btn);
                }
            } else {
                hint.innerText = "";
            }
        }

        function toggleConfig() {
            let panel = document.getElementById('panel-config');
            panel.style.display = (panel.style.display === "block") ? "none" : "block";
        }

        function actualizarPrecio() {
            precioUnitario = Number(document.getElementById('input-precio').value);
            actualizarPantalla();
        }

        function reiniciarDia() {
            if(confirm("¿Poner el contador del día en cero?")) {
                panesDia = 0;
                document.getElementById('total-dia').innerText = panesDia;
            }
        }
    </script>
</body>
</html>
